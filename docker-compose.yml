name: inodebox

services:
  inodebox-app:
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    image: inodebox-app
    container_name: inodebox-app
    depends_on:
      - inodebox-mysql
    restart: unless-stopped
    working_dir: /var/www/inodebox
    volumes:
      - ./:/var/www/inodebox
    networks:
      - inodebox

  inodebox-vite:
    image: inodebox-app
    container_name: inodebox-vite
    depends_on:
      - inodebox-app
    restart: unless-stopped
    working_dir: /var/www/inodebox
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '${DOCKER_FORWARD_PORT_VITE:-5173}:5173'
    volumes:
      - ./:/var/www/inodebox
    networks:
      - inodebox

  inodebox-mysql:
    image: 'mysql:8.4'
    container_name: inodebox-mysql
    ports:
      - '${DOCKER_FORWARD_PORT_DB:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh
    networks:
      - inodebox

  inodebox-nginx:
    image: nginx:1.31.8-alpine
    container_name: inodebox-nginx
    depends_on:
      - inodebox-app
    restart: unless-stopped
    ports:
      - ${DOCKER_FORWARD_PORT_NGINX:-80}:80
    volumes:
      - ./:/var/www/inodebox
      - ./docker/nginx/server.conf:/etc/nginx/conf.d/default.conf
    networks:
      - inodebox

volumes:
  mysql-data:
    driver: local

networks:
  inodebox:
    driver: bridge
